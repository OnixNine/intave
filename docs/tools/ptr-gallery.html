<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intave PTR highlights</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; }
    main { max-width: 1440px; margin: auto; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    article { overflow: hidden; border-radius: 8px; }
    .clip { display: block; padding: 0; border: 0; width: 100%; background: #0a0a0a; cursor: pointer; }
    .clip:focus-visible { outline: 3px solid #67e0a3; outline-offset: -3px; }
    .clip img { display: block; width: 100%; height: auto; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 8px; gap: 8px; } }
  </style>
</head>
<body>
  <main aria-label="Animated PTR highlights">__CARDS__</main>
  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function setPlaying(button, playing) {
      button.setAttribute('aria-pressed', String(playing));
      button.setAttribute('aria-label', (playing ? 'Pause ' : 'Play ') + button.dataset.name);
      button.querySelector('img').src = button.dataset.id + (playing ? '.gif' : '.png') + '?v=' + button.dataset.version;
    }
    for (const button of document.querySelectorAll('.clip')) {
      setPlaying(button, !reducedMotion);
      button.addEventListener('click', () => setPlaying(button, button.getAttribute('aria-pressed') !== 'true'));
    }
  </script>
</body>
</html>
